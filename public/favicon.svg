<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ukBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231f1c"/>
      <stop offset="50%" stop-color="#181513"/>
      <stop offset="100%" stop-color="#0f0d0c"/>
    </linearGradient>
    <linearGradient id="ukOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="ukGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#ukBgGrad)" stroke="url(#ukOrangeGrad)" stroke-width="1.75"/>

  <!-- Center 'UK 09' typography insignia -->
  <g filter="url(#ukGlow)">
    <text x="14" y="38" font-family="'Archivo', 'Arial Black', Impact, sans-serif" font-size="20" font-weight="900" fill="#fafaf9" letter-spacing="-0.5">UK</text>
    <text x="36" y="38" font-family="'Archivo', 'Arial Black', Impact, sans-serif" font-size="17" font-weight="800" fill="url(#ukOrangeGrad)" letter-spacing="0.5">09</text>
  </g>

  <!-- Stylized fork / knife / restaurant accent dot -->
  <circle cx="32" cy="48" r="2.5" fill="url(#ukOrangeGrad)"/>
  <path d="M18 48 H26" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M38 48 H46" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>